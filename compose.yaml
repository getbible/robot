services:
  robot:
    image: "${ROBOT_IMAGE:-ghcr.io/getbible/robot:latest}"
    container_name: "${ROBOT_CONTAINER_NAME:-getbible-robot-production}"
    labels:
      io.getbible.robot.container: "true"
      io.getbible.robot.mode: "single"
    restart: unless-stopped
    environment:
      ROBOT_MODE: "single"
      ROBOT_START_GRACE_SECONDS: "${ROBOT_START_GRACE_SECONDS:-150}"
      ROBOT_HEALTH_INTERVAL_SECONDS: "${ROBOT_HEALTH_INTERVAL_SECONDS:-15}"
      INSTANCE_NAME: "${INSTANCE_NAME:-production}"
      TELEGRAM_API_TOKEN: "${TELEGRAM_API_TOKEN:-}"
      TELEGRAM_API_TOKEN_FILE: "${TELEGRAM_API_TOKEN_FILE:-}"
      TELEGRAM_DELIVERY_MODE: "${TELEGRAM_DELIVERY_MODE:-polling}"
      TELEGRAM_WEBHOOK_PUBLIC_URL: "${TELEGRAM_WEBHOOK_PUBLIC_URL:-}"
      TELEGRAM_WEBHOOK_PORT: "${TELEGRAM_WEBHOOK_PORT:-9001}"
      TELEGRAM_WEBHOOK_SECRET_TOKEN: "${TELEGRAM_WEBHOOK_SECRET_TOKEN:-}"
      TELEGRAM_WEBHOOK_SECRET_TOKEN_FILE: "${TELEGRAM_WEBHOOK_SECRET_TOKEN_FILE:-}"
      TELEGRAM_WEBHOOK_IP_ADDRESS: "${TELEGRAM_WEBHOOK_IP_ADDRESS:-}"
      TELEGRAM_WEBHOOK_MAX_CONNECTIONS: "${TELEGRAM_WEBHOOK_MAX_CONNECTIONS:-16}"
      BOT_NAME: "${BOT_NAME:-GetBible Robot}"
      BOT_DESCRIPTION: "${BOT_DESCRIPTION:-Read and search Scripture in Telegram with GetBible.}"
      BOT_SHORT_DESCRIPTION: "${BOT_SHORT_DESCRIPTION:-Read and search Scripture with GetBible.}"
      TRANSLATION: "${TRANSLATION:-kjv}"
      AUDIT_LOG_MODE: "${AUDIT_LOG_MODE:-metadata}"
      AUDIT_IDENTITY_MODE: "${AUDIT_IDENTITY_MODE:-pseudonymous}"
      LOG_LEVEL: "${LOG_LEVEL:-INFO}"
      MINI_APP_ENABLED: "${MINI_APP_ENABLED:-true}"
      REVERSE_PROXY_MODE: "${REVERSE_PROXY_MODE:-external}"
      MINI_APP_PUBLIC_URL: "${MINI_APP_PUBLIC_URL:-}"
      MINI_APP_PORT: "${MINI_APP_PORT:-9201}"
      MINI_APP_INIT_DATA_MAX_AGE_SECONDS: "${MINI_APP_INIT_DATA_MAX_AGE_SECONDS:-300}"
      MINI_APP_LAUNCH_TTL_SECONDS: "${MINI_APP_LAUNCH_TTL_SECONDS:-300}"
      MINI_APP_SESSION_TTL_SECONDS: "${MINI_APP_SESSION_TTL_SECONDS:-900}"
      MINI_APP_SESSION_LIMIT: "${MINI_APP_SESSION_LIMIT:-200}"
      MINI_APP_SESSIONS_PER_USER: "${MINI_APP_SESSIONS_PER_USER:-2}"
      MINI_APP_MAX_SEARCHES_PER_SESSION: "${MINI_APP_MAX_SEARCHES_PER_SESSION:-2}"
      MINI_APP_MAX_AVAILABLE_SELECTIONS: "${MINI_APP_MAX_AVAILABLE_SELECTIONS:-256}"
      MINI_APP_MAX_SELECTIONS: "${MINI_APP_MAX_SELECTIONS:-100}"
      MINI_APP_BODY_TIMEOUT_SECONDS: "${MINI_APP_BODY_TIMEOUT_SECONDS:-10}"
      MINI_APP_IDLE_TIMEOUT_SECONDS: "${MINI_APP_IDLE_TIMEOUT_SECONDS:-30}"
      MINI_APP_MAX_HEADER_BYTES: "${MINI_APP_MAX_HEADER_BYTES:-16384}"
      MINI_APP_TRUSTED_PROXY_CIDRS: "${MINI_APP_TRUSTED_PROXY_CIDRS:-}"
      MINI_APP_IP_RATE_CAPACITY: "${MINI_APP_IP_RATE_CAPACITY:-60}"
      MINI_APP_IP_RATE_REFILL_PER_SECOND: "${MINI_APP_IP_RATE_REFILL_PER_SECOND:-10}"
      MINI_APP_SESSION_EXCHANGE_RATE_CAPACITY: "${MINI_APP_SESSION_EXCHANGE_RATE_CAPACITY:-10}"
      MINI_APP_SESSION_EXCHANGE_RATE_REFILL_PER_SECOND: "${MINI_APP_SESSION_EXCHANGE_RATE_REFILL_PER_SECOND:-0.2}"
      MINI_APP_NAVIGATION_RATE_COST: "${MINI_APP_NAVIGATION_RATE_COST:-0.25}"
      MINI_APP_ACCESS_LOG: "${MINI_APP_ACCESS_LOG:-true}"
      HEALTH_PORT: "${HEALTH_PORT:-8081}"
      CONTAINER_INSTANCE_MEMORY_LIMIT_MB: "${CONTAINER_INSTANCE_MEMORY_LIMIT_MB:-1792}"
      CONTAINER_INSTANCE_MEMORY_WARNING_PERCENT: "${CONTAINER_INSTANCE_MEMORY_WARNING_PERCENT:-80}"
      PREWARM_DEFAULT_TRANSLATION: "${PREWARM_DEFAULT_TRANSLATION:-true}"
      GETBIBLE_CONNECT_TIMEOUT: "${GETBIBLE_CONNECT_TIMEOUT:-3.05}"
      GETBIBLE_READ_TIMEOUT: "${GETBIBLE_READ_TIMEOUT:-6}"
      GETBIBLE_REQUEST_RETRIES: "${GETBIBLE_REQUEST_RETRIES:-1}"
      GETBIBLE_MAX_RESPONSE_BYTES: "${GETBIBLE_MAX_RESPONSE_BYTES:-41943040}"
      SEARCH_MAX_RESPONSE_BYTES: "${SEARCH_MAX_RESPONSE_BYTES:-4194304}"
      REFERENCE_CACHE_LIMIT: "${REFERENCE_CACHE_LIMIT:-1000}"
      BOOKS_CACHE_LIMIT: "${BOOKS_CACHE_LIMIT:-16}"
      CHAPTER_CACHE_LIMIT: "${CHAPTER_CACHE_LIMIT:-256}"
      SEARCH_CORPUS_LIMIT: "${SEARCH_CORPUS_LIMIT:-1}"
      SEARCH_SHARED_CORPUS_LIMIT: "${SEARCH_SHARED_CORPUS_LIMIT:-8}"
      TRANSLATION_CACHE_LIMIT: "${TRANSLATION_CACHE_LIMIT:-1}"
      CACHE_MAX_BYTES: "${CACHE_MAX_BYTES:-268435456}"
      CACHE_MAINTENANCE_INTERVAL_SECONDS: "${CACHE_MAINTENANCE_INTERVAL_SECONDS:-21600}"
      LOOKUP_TIMEOUT: "${LOOKUP_TIMEOUT:-20}"
      LOOKUP_QUEUE_TIMEOUT: "${LOOKUP_QUEUE_TIMEOUT:-2}"
      MAX_INPUT_LENGTH: "${MAX_INPUT_LENGTH:-256}"
      MAX_REFERENCES: "${MAX_REFERENCES:-8}"
      MAX_VERSES_PER_REFERENCE: "${MAX_VERSES_PER_REFERENCE:-100}"
      MAX_TOTAL_VERSES: "${MAX_TOTAL_VERSES:-100}"
      MAX_OUTPUT_CHUNKS: "${MAX_OUTPUT_CHUNKS:-8}"
      SEARCH_RESULT_LIMIT: "${SEARCH_RESULT_LIMIT:-50}"
      SEARCH_DEADLINE_SECONDS: "${SEARCH_DEADLINE_SECONDS:-5}"
      SEARCH_INDEX_BUILD_SECONDS: "${SEARCH_INDEX_BUILD_SECONDS:-120}"
      SEARCH_TIMEOUT: "${SEARCH_TIMEOUT:-150}"
      MAX_CONCURRENT_LOOKUPS: "${MAX_CONCURRENT_LOOKUPS:-8}"
      MAX_CONCURRENT_SEARCHES: "${MAX_CONCURRENT_SEARCHES:-4}"
      MAX_CONCURRENT_UPDATES: "${MAX_CONCURRENT_UPDATES:-16}"
      USER_RATE_CAPACITY: "${USER_RATE_CAPACITY:-4}"
      USER_RATE_REFILL_PER_SECOND: "${USER_RATE_REFILL_PER_SECOND:-0.2}"
      CHAT_RATE_CAPACITY: "${CHAT_RATE_CAPACITY:-20}"
      CHAT_RATE_REFILL_PER_SECOND: "${CHAT_RATE_REFILL_PER_SECOND:-1}"
      RATE_LIMIT_CACHE_SIZE: "${RATE_LIMIT_CACHE_SIZE:-2000}"
      RATE_LIMIT_NOTICE_COOLDOWN: "${RATE_LIMIT_NOTICE_COOLDOWN:-10}"
      ABUSE_REJECTION_THRESHOLD: "${ABUSE_REJECTION_THRESHOLD:-6}"
      ABUSE_WINDOW_SECONDS: "${ABUSE_WINDOW_SECONDS:-60}"
      ABUSE_BLOCK_SECONDS: "${ABUSE_BLOCK_SECONDS:-300}"
      ABUSE_WARNING_MESSAGE: "${ABUSE_WARNING_MESSAGE:-Your requests have been paused because the bot received repeated requests too quickly. Please stop repeated or automated requests and try again later.}"
      INTERACTION_SESSION_LIMIT: "${INTERACTION_SESSION_LIMIT:-200}"
      INTERACTION_TTL_SECONDS: "${INTERACTION_TTL_SECONDS:-600}"
      CATALOG_CACHE_TTL_SECONDS: "${CATALOG_CACHE_TTL_SECONDS:-3600}"
      USER_PREFERENCE_LIMIT: "${USER_PREFERENCE_LIMIT:-10000}"
      CIRCUIT_FAILURE_THRESHOLD: "${CIRCUIT_FAILURE_THRESHOLD:-5}"
      CIRCUIT_RECOVERY_SECONDS: "${CIRCUIT_RECOVERY_SECONDS:-30}"
      DELETE_COMMAND_MESSAGES: "${DELETE_COMMAND_MESSAGES:-false}"
      DROP_PENDING_UPDATES: "${DROP_PENDING_UPDATES:-true}"
    volumes:
      - robot-data:/data
    # Only the Mini App application port is published. Health stays inside the
    # container. Bind these application ports to an existing HTTPS reverse
    # proxy. The webhook mapping is idle while polling mode is selected.
    ports:
      - "${MINI_APP_BIND_ADDRESS:-127.0.0.1}:${MINI_APP_HOST_PORT:-9201}:${MINI_APP_PORT:-9201}"
      - "${TELEGRAM_WEBHOOK_BIND_ADDRESS:-127.0.0.1}:${TELEGRAM_WEBHOOK_HOST_PORT:-9001}:${TELEGRAM_WEBHOOK_PORT:-9001}"
    read_only: true
    tmpfs:
      - "/tmp:size=${ROBOT_TMPFS_SIZE:-16m},mode=1777"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: "${ROBOT_PIDS_LIMIT:-256}"
    mem_limit: "${ROBOT_MEMORY_LIMIT:-2g}"
    mem_reservation: "${ROBOT_MEMORY_RESERVATION:-1536m}"
    cpus: "${ROBOT_CPU_LIMIT:-2}"
    stop_grace_period: "${ROBOT_STOP_GRACE_PERIOD:-45s}"
    logging:
      driver: local
      options:
        max-size: "${ROBOT_LOG_MAX_SIZE:-10m}"
        max-file: "${ROBOT_LOG_MAX_FILES:-3}"

volumes:
  robot-data:
