[project]
name = "getbible-robot"
version = "2.1.0"
description = "A bounded and resilient Telegram interface for GetBible Scripture."
requires-python = ">=3.10"
license = {text = "GPL-2.0-only"}

[tool.ruff]
target-version = "py310"
line-length = 100
extend-exclude = [".venv", "venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]

[tool.mypy]
python_version = "3.10"
files = ["bot.py", "config.py", "modules", "container"]
mypy_path = "typings"
check_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
show_error_codes = true
warn_redundant_casts = true
warn_unused_configs = true
warn_unused_ignores = true

[tool.bandit]
exclude_dirs = ["tests", ".venv", "venv"]

[tool.coverage.run]
branch = true
relative_files = true
source = ["bot", "config", "modules", "container"]
omit = [
    "tests/*",
    "typings/*",
    "miniapp/*",
    "generated/*",
    "data/*",
    "docker/instances/*",
    "docker/secrets/*",
    "venv/*",
    ".venv/*",
    ".lock-venv/*",
    ".lock-verify-venv/*",
]

[tool.coverage.report]
fail_under = 81.5
precision = 1
show_missing = true
skip_empty = true
