name: Agent browser-direct Bible data integration

on:
  pull_request:
    branches:
      - master
    types:
      - opened
      - reopened
      - synchronize

permissions:
  contents: write

concurrency:
  group: agent-direct-browser-api-cache
  cancel-in-progress: true

jobs:
  integrate-and-validate:
    if: github.head_ref == 'agent/direct-browser-api-cache'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out feature branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.0
        with:
          ref: agent/direct-browser-api-cache
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: miniapp/package-lock.json

      - name: Apply reviewed integration patch
        shell: bash
        run: |
          set -euo pipefail
          git show dee373f748664e562201cad57aa318fcd74cc20d:.github/agent/direct-browser-api-cache.mjs.gz.b64 \
            | base64 --decode \
            | gzip --decompress > /tmp/direct-browser-api-cache.mjs
          echo "0521754f9327821898f826b97d9e884a8d17422c00716c77c72d84511963301b  /tmp/direct-browser-api-cache.mjs" \
            | sha256sum --check --strict
          python - <<'PY'
          from pathlib import Path

          path = Path("/tmp/direct-browser-api-cache.mjs")
          source = path.read_text(encoding="utf-8")
          before = "The Mini App resolves explicit `/bible` references through the public Query API"
          after = "The Mini App resolves explicit /bible references through the public Query API"
          if source.count(before) != 1:
              raise SystemExit("Expected exactly one documentation patch anchor.")
          path.write_text(source.replace(before, after), encoding="utf-8")
          PY
          echo "195069de4d66d0976ec8d22714309c9bde97bbbe7296786182774766fe284d52  /tmp/direct-browser-api-cache.mjs" \
            | sha256sum --check --strict
          node --check /tmp/direct-browser-api-cache.mjs
          node /tmp/direct-browser-api-cache.mjs
          python - <<'PY'
          from pathlib import Path

          for name in (
              "docs/ARCHITECTURE.md",
              "docs/INTERACTIONS.md",
              "docs/RELEASE_GATE.md",
              "docs/TESTING.md",
          ):
              path = Path(name)
              path.write_text(
                  path.read_text(encoding="utf-8").rstrip() + "\n",
                  encoding="utf-8",
              )
          PY
          git diff --check

      - name: Install locked development dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m venv venv
          venv/bin/pip install --require-hashes -r requirements-dev.txt
          npm --prefix miniapp ci --ignore-scripts
          (
            cd miniapp
            npx playwright install --with-deps chromium
          )

      - name: Run complete repository quality gate
        shell: bash
        run: bash scripts/run-checks.sh

      - name: Commit validated architecture
        shell: bash
        run: |
          set -euo pipefail
          git rm -- \
            .github/agent/direct-browser-api-cache.mjs.gz.b64 \
            .github/workflows/agent-direct-browser-api-cache.yml
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "Integration produced no changes." >&2
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Move Mini App Bible reads to cached browser API"
          git push origin HEAD:agent/direct-browser-api-cache
