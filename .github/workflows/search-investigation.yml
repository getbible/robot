name: Search request investigation
on:
  push:
    branches: [fix/miniapp-search]
    paths: [.github/workflows/search-investigation.yml]
permissions:
  contents: read
jobs:
  investigate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - name: Download public test dependencies
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/search-wheels"
          python -m pip download --only-binary=:all: 'Flask==3.1.3' 'getbible==3.0.0' 'gunicorn==26.2.0' jsonschema pytest requests -d "$RUNNER_TEMP/search-wheels"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: search-test-wheels
          path: ${{ runner.temp }}/search-wheels/
          retention-days: 3
