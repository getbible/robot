name: Search request investigation

on:
  push:
    branches: [fix/miniapp-search]
    paths: [.github/workflows/search-investigation.yml]

permissions:
  contents: read

jobs:
  investigate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - name: Capture upstream sources and dependencies
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/search-sources/wheels"
          git clone --quiet --depth 1 https://github.com/getbible/api.git "$RUNNER_TEMP/api-source"
          git -C "$RUNNER_TEMP/api-source" archive HEAD > "$RUNNER_TEMP/search-sources/api.tar"
          git -C "$RUNNER_TEMP/api-source" rev-parse HEAD > "$RUNNER_TEMP/search-sources/api-revision.txt"
          grep -R -n 'getbible==' "$RUNNER_TEMP/api-source/src/apps" | head -15 || true
          python -m pip download --only-binary=:all: flask getbible jsonschema pytest requests gunicorn -d "$RUNNER_TEMP/search-sources/wheels"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: search-upstream-sources
          path: ${{ runner.temp }}/search-sources/
          retention-days: 3
