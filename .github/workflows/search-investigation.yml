name: Prepare rebased search regression sources
on:
  push:
    branches: [fix/miniapp-search]
    paths: [.github/workflows/search-investigation.yml]
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Export source snapshot
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/search-sources"
          git archive --format=tar HEAD > "$RUNNER_TEMP/search-sources/robot.tar"
          git rev-parse HEAD > "$RUNNER_TEMP/search-sources/robot-revision.txt"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: rebased-search-sources
          path: ${{ runner.temp }}/search-sources/
          retention-days: 3
