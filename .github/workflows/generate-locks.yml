name: Generate dependency locks

on:
  push:
    branches: [master]

permissions:
  contents: write

concurrency:
  group: dependency-lock-generation
  cancel-in-progress: false

jobs:
  lock:
    if: github.event.head_commit.message != 'Lock runtime and development dependencies [skip ci]' && github.event.head_commit.message != 'Report dependency lock failure [skip ci]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: master

      - name: Set up Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.in
            requirements-dev.in

      - name: Compile, verify, and commit hashed locks
        shell: bash
        run: |
          set +e
          {
            python -m pip install --disable-pip-version-check pip-tools==7.4.1 &&
            python -m piptools compile \
              --resolver=backtracking \
              --generate-hashes \
              --allow-unsafe \
              --output-file=requirements.txt \
              requirements.in &&
            python -m piptools compile \
              --resolver=backtracking \
              --generate-hashes \
              --allow-unsafe \
              --output-file=requirements-dev.txt \
              requirements-dev.in &&
            python -m pip install --require-hashes -r requirements-dev.txt &&
            python -m pip check
          } > lock-generation.log 2>&1
          status=$?
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ "$status" -eq 0 ]; then
            rm -f lock-generation.log lock-failure.txt
            git add requirements.txt requirements-dev.txt
            git commit -m "Lock runtime and development dependencies [skip ci]"
          else
            tail -n 80 lock-generation.log > lock-failure.txt
            rm -f lock-generation.log
            git add lock-failure.txt
            git commit -m "Report dependency lock failure [skip ci]"
          fi
          git push origin HEAD:master
          exit "$status"
