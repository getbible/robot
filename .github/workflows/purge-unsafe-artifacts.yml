name: Purge unsafe diagnostic artifacts

on:
  push:
    branches: [master]

permissions:
  actions: write
  contents: read

jobs:
  purge:
    if: github.event.head_commit.message == 'Purge unsafe diagnostic artifacts'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Delete broad quality-failure artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request

          repository = os.environ["GITHUB_REPOSITORY"]
          token = os.environ["GH_TOKEN"]
          base = f"https://api.github.com/repos/{repository}/actions/artifacts"
          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {token}",
              "X-GitHub-Api-Version": "2022-11-28",
          }

          artifact_ids = []
          page = 1
          while True:
              request = urllib.request.Request(
                  f"{base}?per_page=100&page={page}",
                  headers=headers,
              )
              with urllib.request.urlopen(request, timeout=30) as response:
                  payload = json.load(response)
              artifacts = payload.get("artifacts", [])
              artifact_ids.extend(
                  artifact["id"]
                  for artifact in artifacts
                  if artifact.get("name") == "quality-failure"
              )
              if len(artifacts) < 100:
                  break
              page += 1

          for artifact_id in artifact_ids:
              request = urllib.request.Request(
                  f"{base}/{artifact_id}",
                  headers=headers,
                  method="DELETE",
              )
              with urllib.request.urlopen(request, timeout=30) as response:
                  if response.status != 204:
                      raise RuntimeError(
                          f"Unexpected deletion status for artifact {artifact_id}: "
                          f"{response.status}"
                      )

          print(f"Deleted {len(artifact_ids)} quality-failure artifacts.")
          PY
