name: One-time universal lock and lint repair

on:
  push:
    branches: [master]

permissions:
  contents: write
  statuses: write

concurrency:
  group: universal-lock-and-lint-repair
  cancel-in-progress: false

jobs:
  repair:
    if: github.event.head_commit.message == 'Prepare universal lock and lint repair'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout master
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: master
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.in
            requirements-dev.in

      - name: Repair source, regenerate locks, and validate
        id: validation
        shell: bash
        run: |
          set -o pipefail
          {
            python - <<'PY'
            from pathlib import Path

            def replace(path: str, old: str, new: str) -> None:
                file = Path(path)
                text = file.read_text(encoding="utf-8")
                if old not in text:
                    raise SystemExit(f"Expected repair marker not found in {path}: {old!r}")
                file.write_text(text.replace(old, new), encoding="utf-8")

            replace(
                "modules/commands.py",
                "isinstance(error, (ReferenceValidationError, RobotInputError))",
                "isinstance(error, ReferenceValidationError | RobotInputError)",
            )
            replace(
                "modules/commands.py",
                "isinstance(error, (CircuitOpen, ScriptureUnavailable))",
                "isinstance(error, CircuitOpen | ScriptureUnavailable)",
            )
            replace(
                "modules/health.py",
                "import logging\nfrom typing import Any",
                "import logging\nfrom contextlib import suppress\nfrom typing import Any",
            )
            replace(
                "modules/health.py",
                "            try:\n                await writer.wait_closed()\n            except ConnectionError:\n                pass",
                "            with suppress(ConnectionError):\n                await writer.wait_closed()",
            )
            replace(
                "tests/test_config.py",
                '''        with patch.dict(\n            os.environ,\n            self.environment(TELEGRAM_TOKEN="different-token"),\n            clear=True,\n        ):\n            with self.assertRaises(ConfigurationError):\n                Settings.from_env(load_environment_file=False)''',
                '''        with patch.dict(\n            os.environ,\n            self.environment(TELEGRAM_TOKEN="different-token"),\n            clear=True,\n        ), self.assertRaises(ConfigurationError):\n            Settings.from_env(load_environment_file=False)''',
            )
            replace(
                "tests/test_config.py",
                '''            with self.subTest(value=value), patch.dict(\n                os.environ,\n                self.environment(GETBIBLE_WEB_BASE_URL=value),\n                clear=True,\n            ):\n                with self.assertRaises(ConfigurationError):\n                    Settings.from_env(load_environment_file=False)''',
                '''            with (\n                self.subTest(value=value),\n                patch.dict(\n                    os.environ,\n                    self.environment(GETBIBLE_WEB_BASE_URL=value),\n                    clear=True,\n                ),\n                self.assertRaises(ConfigurationError),\n            ):\n                Settings.from_env(load_environment_file=False)''',
            )
            replace(
                "tests/test_config.py",
                '''        with patch.dict(\n            os.environ,\n            self.environment(\n                MAX_VERSES_PER_REFERENCE="100",\n                MAX_TOTAL_VERSES="50",\n            ),\n            clear=True,\n        ):\n            with self.assertRaises(ConfigurationError):\n                Settings.from_env(load_environment_file=False)''',
                '''        with patch.dict(\n            os.environ,\n            self.environment(\n                MAX_VERSES_PER_REFERENCE="100",\n                MAX_TOTAL_VERSES="50",\n            ),\n            clear=True,\n        ), self.assertRaises(ConfigurationError):\n            Settings.from_env(load_environment_file=False)''',
            )

            requirements = Path("requirements.in")
            text = requirements.read_text(encoding="utf-8")
            if "exceptiongroup==1.3.1" not in text:
                requirements.write_text(text + "exceptiongroup==1.3.1\n", encoding="utf-8")
            PY

            python -m pip install --disable-pip-version-check pip==24.3.1 pip-tools==7.4.1
            python -m piptools compile \
              --resolver=backtracking \
              --generate-hashes \
              --allow-unsafe \
              --output-file=requirements.txt \
              requirements.in
            python -m piptools compile \
              --resolver=backtracking \
              --generate-hashes \
              --allow-unsafe \
              --output-file=requirements-dev.txt \
              requirements-dev.in
            python -m pip install --require-hashes -r requirements-dev.txt
            python -m pip check
            ruff check . --fix
            ruff check .
            mypy
            python -m compileall -q bot.py config.py modules tests
            python -m unittest discover -s tests -v
          } 2>&1 | tee repair.log

      - name: Commit validated repair
        run: |
          rm -f repair.log .github/workflows/repair-universal-lock.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Apply universal lock and lint corrections"
          git push origin HEAD:master

      - name: Upload repair diagnostics
        if: failure()
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08
        with:
          name: universal-lock-repair-failure
          path: repair.log
          if-no-files-found: warn

      - name: Publish repair status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          REPAIR_OUTCOME: ${{ steps.validation.outcome }}
        run: |
          state=failure
          description="Universal lock or lint repair failed"
          if [ "$REPAIR_OUTCOME" = success ]; then
            state=success
            description="Universal lock and lint repair passed"
          fi
          target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          payload=$(python - "$state" "$description" "$target_url" <<'PY'
          import json
          import sys

          print(json.dumps({
              "state": sys.argv[1],
              "context": "robot/repair-gate",
              "description": sys.argv[2],
              "target_url": sys.argv[3],
          }))
          PY
          )
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            --data "$payload"
