name: CodeQL

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    - cron: "23 4 * * 3"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Initialize CodeQL
        uses: github/codeql-action/init@7c4a2585440bbc7499024911ad98cd011a05164f
        with:
          languages: python
          build-mode: none

      - name: Analyze
        uses: github/codeql-action/analyze@7c4a2585440bbc7499024911ad98cd011a05164f
        with:
          category: "/language:python"
