name: CodeQL

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    - cron: "23 4 * * 3"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Initialize CodeQL
        uses: github/codeql-action/init@cf463419fdde78c727231e445622a9ac37966f84
        with:
          languages: python
          build-mode: none

      - name: Analyze
        uses: github/codeql-action/analyze@7c4a2585440bbc7499024911ad98cd011a05164f
        with:
          category: "/language:python"
