name: CodeQL

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    - cron: "23 4 * * 3"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  statuses: write

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Initialize CodeQL
        uses: github/codeql-action/init@7c4a2585440bbc7499024911ad98cd011a05164f
        with:
          languages: python
          build-mode: none

      - name: Analyze
        uses: github/codeql-action/analyze@7c4a2585440bbc7499024911ad98cd011a05164f
        with:
          category: "/language:python"

  gate:
    name: CodeQL gate status
    if: always() && github.event_name == 'push'
    needs: [analyze]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Publish commit status
        env:
          GH_TOKEN: ${{ github.token }}
          ANALYZE_RESULT: ${{ needs.analyze.result }}
        run: |
          state=failure
          description="CodeQL analysis failed"
          if [ "$ANALYZE_RESULT" = success ]; then
            state=success
            description="CodeQL analysis passed"
          fi
          target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          payload=$(python - "$state" "$description" "$target_url" <<'PY'
          import json
          import sys

          print(json.dumps({
              "state": sys.argv[1],
              "context": "robot/codeql-gate",
              "description": sys.argv[2],
              "target_url": sys.argv[3],
          }))
          PY
          )
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            --data "$payload"
          [ "$state" = success ]
