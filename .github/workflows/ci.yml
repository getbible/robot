name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install exact runtime
        shell: bash
        run: |
          set -o pipefail
          python -m pip install --require-hashes -r requirements.txt \
            2>&1 | tee "${RUNNER_TEMP}/runtime-install.log"

      - name: Verify installed dependencies
        shell: bash
        run: |
          set -o pipefail
          python -m pip check 2>&1 | tee "${RUNNER_TEMP}/pip-check.log"

      - name: Compile source
        shell: bash
        run: |
          set -o pipefail
          python -m compileall -q bot.py config.py modules scripts tests \
            2>&1 | tee "${RUNNER_TEMP}/compile.log"

      - name: Validate setup manager
        shell: bash
        run: |
          set -o pipefail
          bash -n setup.sh
          bash -n tests/setup_manager_lifecycle.sh
          bash setup.sh self-test 2>&1 | tee "${RUNNER_TEMP}/setup-manager.log"
          bash tests/setup_manager_lifecycle.sh \
            2>&1 | tee -a "${RUNNER_TEMP}/setup-manager.log"

      - name: Run deterministic test suite
        shell: bash
        run: |
          set -o pipefail
          python -m unittest discover -s tests -v \
            2>&1 | tee "${RUNNER_TEMP}/tests.log"

      - name: Upload test diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: test-failure-python-${{ matrix.python-version }}
          path: |
            ${{ runner.temp }}/runtime-install.log
            ${{ runner.temp }}/pip-check.log
            ${{ runner.temp }}/compile.log
            ${{ runner.temp }}/setup-manager.log
            ${{ runner.temp }}/tests.log
          if-no-files-found: warn

  quality:
    name: Quality and security
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install exact development environment
        shell: bash
        run: |
          set -o pipefail
          python -m pip install --require-hashes -r requirements-dev.txt \
            2>&1 | tee "${RUNNER_TEMP}/development-install.log"

      - name: Lint
        shell: bash
        run: |
          set -o pipefail
          ruff check . 2>&1 | tee "${RUNNER_TEMP}/ruff.log"

      - name: Type check
        shell: bash
        run: |
          set -o pipefail
          mypy 2>&1 | tee "${RUNNER_TEMP}/mypy.log"

      - name: Static security scan
        shell: bash
        run: |
          set -o pipefail
          librarian_path=$(python - <<'PY'
          from pathlib import Path

          import getbible

          print(Path(getbible.__file__).resolve().parent)
          PY
          )
          bandit -q -r bot.py config.py modules scripts "$librarian_path" -ll \
            2>&1 | tee "${RUNNER_TEMP}/bandit.log"

      - name: Dependency vulnerability scan
        shell: bash
        run: |
          set -o pipefail
          python scripts/audit_runtime.py \
            2>&1 | tee "${RUNNER_TEMP}/pip-audit.log"

      - name: Secret scan
        shell: bash
        run: |
          set -o pipefail
          detect-secrets scan \
            --all-files \
            --exclude-files '(^|/)\.git/' \
            --exclude-files '(^|/)\.(mypy|ruff)_cache/' \
            --exclude-files '(^|/)\.env\.template$' \
            --exclude-files '(^|/)requirements(-dev)?\.txt$' \
            > "${RUNNER_TEMP}/secrets.json"
          python - "${RUNNER_TEMP}/secrets.json" <<'PY' \
            2>&1 | tee "${RUNNER_TEMP}/detect-secrets.log"
          import json
          import pathlib
          import sys

          report = json.loads(pathlib.Path(sys.argv[1]).read_text(encoding="utf-8"))
          findings = report.get("results", {})
          if findings:
              print(json.dumps(findings, indent=2))
              raise SystemExit("Potential secrets detected.")
          PY

      - name: Verify systemd unit
        shell: bash
        run: |
          set -o pipefail
          sudo useradd \
            --system \
            --user-group \
            --home-dir /var/lib/getbible-robot/ci \
            --shell /usr/sbin/nologin \
            gb-ci
          sudo install -d \
            /opt/getbible-robot/ci/app/venv/bin \
            /var/cache/getbible-robot/ci \
            /var/log/getbible-robot \
            /etc/getbible-robot
          sudo ln -s "$(command -v python)" \
            /opt/getbible-robot/ci/app/venv/bin/python
          sudo install -o root -g root -m 0600 \
            config.py \
            /opt/getbible-robot/ci/app/config.py
          sudo touch \
            /etc/getbible-robot/ci.env \
            /var/log/getbible-robot/ci.jsonl
          sudo chmod 0700 /opt/getbible-robot/ci/app
          sudo chown gb-ci:gb-ci \
            /var/cache/getbible-robot/ci \
            /var/log/getbible-robot/ci.jsonl
          sudo bash -c '
            source setup.sh
            secure_application_tree /opt/getbible-robot/ci/app gb-ci
            verify_service_account_access /opt/getbible-robot/ci/app gb-ci
          '
          sudo install -o root -g root -m 0644 \
            deploy/getbible-robot@.service \
            /etc/systemd/system/getbible-robot@.service
          sudo systemctl daemon-reload
          systemd-analyze verify getbible-robot@ci.service \
            2>&1 | tee "${RUNNER_TEMP}/systemd.log"

      - name: Upload quality diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: quality-failure
          path: |
            ${{ runner.temp }}/development-install.log
            ${{ runner.temp }}/ruff.log
            ${{ runner.temp }}/mypy.log
            ${{ runner.temp }}/bandit.log
            ${{ runner.temp }}/pip-audit.log
            ${{ runner.temp }}/detect-secrets.log
            ${{ runner.temp }}/systemd.log
            ${{ runner.temp }}/secrets.json
          if-no-files-found: warn

  gate:
    name: Security gate status
    if: always() && github.event_name == 'push'
    needs: [test, quality]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Publish commit status
        env:
          GH_TOKEN: ${{ github.token }}
          TEST_RESULT: ${{ needs.test.result }}
          QUALITY_RESULT: ${{ needs.quality.result }}
        run: |
          state=failure
          description="Robot CI or security checks failed"
          if [ "$TEST_RESULT" = success ] && [ "$QUALITY_RESULT" = success ]; then
            state=success
            description="Robot CI and security checks passed"
          fi
          target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          payload=$(python - "$state" "$description" "$target_url" <<'PY'
          import json
          import sys

          print(json.dumps({
              "state": sys.argv[1],
              "context": "robot/security-gate",
              "description": sys.argv[2],
              "target_url": sys.argv[3],
          }))
          PY
          )
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            --data "$payload"
          [ "$state" = success ]
