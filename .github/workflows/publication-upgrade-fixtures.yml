name: Apply verified publication implementation
on:
  push:
    branches: [feat/api-bookmark-publication]
    paths: [.github/publication-transfer/03.b64]
permissions:
  contents: write
concurrency:
  group: publication-implementation-transfer
  cancel-in-progress: false
jobs:
  apply:
    if: github.repository == 'getbible/robot' && github.ref == 'refs/heads/feat/api-bookmark-publication'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Verify and apply the tested source patch
        shell: bash
        run: |
          set -euo pipefail
          cat .github/publication-transfer/{00,01,02,03}.b64 | base64 --decode > "$RUNNER_TEMP/implementation.patch.xz"
          echo "1a0f1d88ca7f4d93635bc1ced35d99a370573c64ccc8170026ae2e6c7bca1a77  $RUNNER_TEMP/implementation.patch.xz" | sha256sum --check
          xz --decompress --stdout "$RUNNER_TEMP/implementation.patch.xz" > "$RUNNER_TEMP/implementation.patch"
          echo "2d1a7e149d45daee46682adbc37be33357158adc4e4e02747ab05766d22c5f28  $RUNNER_TEMP/implementation.patch" | sha256sum --check
          git apply --check "$RUNNER_TEMP/implementation.patch"
          git apply "$RUNNER_TEMP/implementation.patch"
          git diff --check
          python3 -m compileall -q modules scripts
          bash -n setup.sh container/setup.sh tests/setup_manager_lifecycle.sh
          git add .env.template CHANGELOG.md README.md compose.single.yaml compose.yaml container/setup.sh docs modules/bookmark_sources.py modules/contribution_publication.py scripts/contribution_publish.py scripts/contribution_review.py setup.sh tests
          git -c user.name='GetBible Development' -c user.email='development@getbible.net' commit -m 'Publish accepted bookmarks atomically through GitHub API with optional translations and safe upgrades'
          git rm .github/publication-transfer/{00,01,02,03}.b64
          git -c user.name='GetBible Development' -c user.email='development@getbible.net' commit -m 'Remove temporary implementation transfer payload'
          git push origin HEAD:refs/heads/feat/api-bookmark-publication
