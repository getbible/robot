# Optional security overlay. It converts TELEGRAM_API_TOKEN from the host
# environment or project .env file into a mode-0400 Compose secret and removes
# the token from the container environment.
services:
  robot:
    environment:
      TELEGRAM_API_TOKEN: ""
      TELEGRAM_API_TOKEN_FILE: "/run/secrets/telegram_bot_token"
    secrets:
      - source: telegram_bot_token
        target: telegram_bot_token
        uid: "10001"
        gid: "10001"
        mode: 0400

secrets:
  telegram_bot_token:
    environment: TELEGRAM_API_TOKEN
